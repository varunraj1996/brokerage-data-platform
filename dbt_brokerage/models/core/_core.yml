version: 2

models:
  - name: dim_advisor
    description: "Advisors. Grain: one row per advisor. SCD1."
    columns:
      - name: advisor_sk
        data_tests: [unique, not_null]
      - name: advisor_id
        data_tests: [unique, not_null]

  - name: dim_client
    description: "Clients. Grain: one row per client (current version; SCD2 from slice 3)."
    columns:
      - name: client_sk
        data_tests: [unique, not_null]
      - name: client_id
        data_tests: [unique, not_null]
      - name: advisor_id
        data_tests:
          - not_null
          - relationships:              # every client has a real advisor
              arguments:
                to: ref('dim_advisor')
                field: advisor_id
      - name: age_years
        data_tests:
          - dbt_utils.accepted_range:   # plausible ages; outliers are worth a look, not a failure
              arguments:
                min_value: 18
                max_value: 110
              config:
                severity: warn

  - name: dim_account
    description: "Accounts. Grain: one row per account."
    columns:
      - name: account_sk
        data_tests: [unique, not_null]
      - name: account_id
        data_tests: [unique, not_null]
      - name: client_id
        data_tests:
          - not_null
          - relationships:              # every account belongs to a real client
              arguments:
                to: ref('dim_client')
                field: client_id
      - name: account_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['Open', 'Closed']

  - name: dim_date
    description: "Calendar. Grain: one row per day, 2024-01-01 to 2025-12-31."
    columns:
      - name: date_key
        data_tests: [unique, not_null]
      - name: calendar_date
        data_tests: [unique, not_null]
      - name: is_trading_day
        description: "True when the US market was open (SPY has a price that day)."
        data_tests: [not_null]

  - name: dim_security
    description: "Securities. Grain: one row per company version (SCD2). History before the first snapshot comes from SEC former names; later changes from the dbt snapshot snp_security."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cik, valid_from]
    columns:
      - name: security_sk
        data_tests: [unique, not_null]
      - name: cik
        data_tests: [not_null]
      - name: version_source
        data_tests:
          - accepted_values:
              arguments:
                values: ['sec_name_history', 'dbt_snapshot']

  - name: fct_daily_prices
    description: "Daily prices. Grain: one row per security per trading day."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, date_key]
    columns:
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: security_sk
        description: "The dim_security version valid on the trading day (as-of join)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_security')
                field: security_sk
      - name: ticker
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('ref_universe')
                field: ticker
      - name: close
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: daily_price_return
        description: "Day-over-day change in split-adjusted close (price only, no dividends)."
        data_tests:
          - dbt_utils.accepted_range:      # a move beyond ±50% in a day is almost certainly a data problem
              arguments:
                min_value: -0.5
                max_value: 0.5
              config:
                severity: warn

  - name: fct_trades
    description: >
      Trade executions. Grain: one row per trade. Incremental (MERGE on trade_id), liquid-clustered on
      trade_date and account_id. signed_quantity is + for buys and − for sells; cash_impact is the cash change.
    columns:
      - name: trade_id
        data_tests: [unique, not_null]
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: account_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_sk
      - name: security_sk
        description: "The dim_security version valid on the trade date (as-of join)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_security')
                field: security_sk
      - name: side
        data_tests:
          - accepted_values:
              arguments:
                values: ['BUY', 'SELL']
      - name: quantity
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: price
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

  - name: fct_cash_movements
    description: >
      Every change to an account's cash balance. Grain: one row per movement. amount is signed (+ in, − out).
      flow_type 'external' = deposits and withdrawals (excluded from returns); 'internal' = trades and fees.
    columns:
      - name: movement_id
        data_tests: [unique, not_null]
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: account_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_sk
      - name: movement_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['DEPOSIT', 'WITHDRAWAL', 'BUY', 'SELL', 'FEE', 'DIVIDEND']
      - name: flow_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['external', 'internal']

  - name: fct_corporate_actions
    description: >
      Dividends and splits. Grain: one row per stock per event on its ex-date. cash_per_adjusted_share is the
      dividend in today's share units (positions use these units); split_ratio is new shares per old share.
    columns:
      - name: action_id
        data_tests: [unique, not_null]
      - name: security_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_security')
                field: security_sk
      - name: action_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['DIVIDEND', 'SPLIT']
      - name: cash_per_adjusted_share
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
              config:
                where: "action_type = 'DIVIDEND'"

  - name: fct_daily_positions
    description: >
      Shares each account holds of each stock at the end of every trading day (periodic snapshot, carry-forward).
      Grain: account × stock × trading day while held, plus the day it is sold out. SEMI-ADDITIVE: sum across
      accounts or stocks on one day, never across days. dividend_cash = shares held the day before the ex-date ×
      dividend per split-adjusted share.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [account_id, ticker, position_date]
    columns:
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: account_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_sk
      - name: security_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_security')
                field: security_sk
      - name: shares_held
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: market_value
        description: "shares_held × that day's split-adjusted close. Null would mean a missing price."
        data_tests: [not_null]

  - name: fct_daily_account_value
    description: >
      Each account's value at the end of every trading day, from its first deposit until it closes.
      total_value = market_value + cash_balance. external_flow = deposits − withdrawals (not performance).
      daily_pnl = total_value − yesterday's total_value − external_flow. Semi-additive across days.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [account_id, value_date]
    columns:
      - name: account_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_sk
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: cash_balance
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -0.005
      - name: total_value
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -0.005
