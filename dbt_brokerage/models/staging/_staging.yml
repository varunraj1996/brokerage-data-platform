version: 2

models:
  - name: stg_advisors
    description: One row per advisor.
    columns:
      - name: advisor_id
        data_tests: [unique, not_null]

  - name: stg_clients
    description: One row per client (current version).
    columns:
      - name: client_id
        data_tests: [unique, not_null]
      - name: risk_profile
        data_tests:
          - accepted_values:
              arguments:
                values: ['Conservative', 'Moderate', 'Aggressive']
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['Mass', 'Affluent', 'HNW']

  - name: stg_accounts
    description: One row per account.
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: account_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Individual', 'Joint', 'IRA', 'Roth IRA']

  - name: stg_daily_prices
    description: One row per ticker per trading day, from silver.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, trade_date]
    columns:
      - name: ticker
        data_tests: [not_null]
      - name: trade_date
        data_tests: [not_null]

  - name: stg_securities
    description: One row per universe ticker, current SEC identity.
    columns:
      - name: ticker
        data_tests: [unique, not_null]
      - name: cik
        data_tests: [unique, not_null]

  - name: stg_security_name_history
    description: Legal-name periods per company (contiguous, no overlaps).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cik, valid_from]
