version: 2

sources:
  - name: silver
    description: Cleaned, validated copies of the Azure SQL brokerage source (built by notebook 04).
    database: "{{ env_var('DBT_CATALOG', 'brokerage_dev') }}"
    schema: silver
    config:
      loaded_at_field: _silver_loaded_at
      freshness:
        warn_after: {count: 26, period: hour}    # one missed daily run → warning
        error_after: {count: 50, period: hour}   # two missed runs → error
    tables:
      - name: advisors
      - name: clients
      - name: accounts
      - name: cash_ledger
        description: Deposits and withdrawals from the Azure SQL cash ledger (notebook 04).
      - name: daily_prices
        description: Validated daily prices from Tiingo (notebook 06). A frozen 2024–2025 snapshot, so freshness is not checked.
        config:
          freshness: null
      - name: securities
        description: One row per universe ticker with its SEC identity (notebook 09).
        config:
          freshness: null      # refreshed on demand from SEC snapshots, not on a daily schedule yet
      - name: security_name_history
        description: Contiguous legal-name periods per company from SEC former names (notebook 09).
        config:
          freshness: null
      - name: live_bars_1m
        description: Live 1-minute bars from the Finnhub websocket (notebook 15). Only filled during live sessions.
        config:
          freshness: null
      - name: trades
        description: One row per trade execution, deduplicated and validated from the trade stream (notebook 13).
        config:
          freshness: null      # the stream runs on demand (cluster cost), not on a schedule yet

  - name: sim
    description: >
      Ground truth written by the generator (notebook 10), before the stream adds duplicates and late events.
      Used only by tests, never by models: it proves the pipeline delivered exactly what was generated.
    database: "{{ env_var('DBT_CATALOG', 'brokerage_dev') }}"
    schema: sim
    tables:
      - name: trades
      - name: cash_movements

  - name: audit
    description: Run evidence written by the notebooks.
    database: "{{ env_var('DBT_CATALOG', 'brokerage_dev') }}"
    schema: audit
    tables:
      - name: emit_manifest
        description: One row per day of trade events emitted by notebook 11.
